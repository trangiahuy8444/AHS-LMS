  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function sha256Sync(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      var mathPow = Math.pow;
      var maxWord = mathPow(2, 32);
      var lengthProperty = 'length';
      var i, j;
      var result = '';
      var words = [];
      var asciiBitLength = ascii[lengthProperty] * 8;
      var hash = [];
      var k = [];
      var primeCounter = 0;
      var isComposite = {};
      for (var candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = candidate * candidate; i < 312; i += candidate) {
            isComposite[i] = true;
          }
          if (primeCounter < 8) {
            hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          }
          k[primeCounter] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
          primeCounter++;
        }
      }
      ascii += '\x80';
      while ((ascii[lengthProperty] % 64) - 56) ascii += '\x00';
      for (i = 0; i < ascii[lengthProperty]; i++) {
        j = ascii.charCodeAt(i);
        if (j >> 8) return;
        words[i >> 2] |= j << (((3 - i) % 4) * 8);
      }
      words[words[lengthProperty]] = (asciiBitLength / maxWord) | 0;
      words[words[lengthProperty]] = asciiBitLength;
      for (j = 0; j < words[lengthProperty]; ) {
        var w = words.slice(j, (j += 16));
        var oldHash = hash;
        hash = hash.slice(0, 8);
        for (i = 0; i < 64; i++) {
          var w15 = w[i - 15], w2 = w[i - 2];
          var s0 = rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3);
          var s1 = rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10);
          var ch = (hash[4] & hash[5]) ^ (~hash[4] & hash[6]);
          var maj = (hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]);
          var temp1 =
            hash[7] +
            (rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25)) +
            ch +
            k[i] +
            (w[i] =
              i < 16
                ? w[i]
                : (w[i - 16] + s0 + w[i - 7] + s1) | 0);
          var temp2 =
            (rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22)) +
            maj;
          hash = [(temp1 + temp2) | 0].concat(hash);
          hash[4] = (hash[4] + temp1) | 0;
        }
        for (i = 0; i < 8; i++) {
          hash[i] = (hash[i] + oldHash[i]) | 0;
        }
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j >= 0; j--) {
          var b = (hash[i] >> (j * 8)) & 255;
          result += (b < 16 ? '0' : '') + b.toString(16);
        }
      }
      return result;
    }

    async function sha256(message) {
      try {
        if (typeof crypto !== 'undefined' && crypto.subtle && crypto.subtle.digest) {
          const msgBuffer = new TextEncoder().encode(message);
          const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (e) { /* fallback to sync */ }
      return sha256Sync(message);
    }

    function AdminApp() {
      // Auth state
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');

      // Navigation: 6 Core Tabs
      const [activeTab, setActiveTab] = useState('live'); // 'live' | 'submissions' | 'answers' | 'analytics' | 'print' | 'config'
      
      // Data state
      const [liveSessions, setLiveSessions] = useState([]);
      const [submissions, setSubmissions] = useState([]);
      const [config, setConfig] = useState(window.AsianSchoolStorage.getConfig());
      const [auditLogs, setAuditLogs] = useState([]);

      // Submissions filtering & grading
      const [filterGrade, setFilterGrade] = useState('all');
      const [filterClass, setFilterClass] = useState('all');
      const [filterMode, setFilterMode] = useState('all');
      const [filterGraded, setFilterGraded] = useState('all'); // 'all' | 'graded' | 'pending'
      const [searchQuery, setSearchQuery] = useState('');
      
      // Grading modal state
      const [gradingSubmission, setGradingSubmission] = useState(null);
      const [tempEssayScores, setTempEssayScores] = useState({});
      const [tempFeedback, setTempFeedback] = useState('');
      const [gradingSuccessAlert, setGradingSuccessAlert] = useState(false);

      // Proctor Broadcast & Messaging Modal
      const [showBroadcastModal, setShowBroadcastModal] = useState(false);
      const [broadcastTarget, setBroadcastTarget] = useState('all'); // 'all' or sessionId
      const [broadcastMsgInput, setBroadcastMsgInput] = useState('');
      const [individualMsgTarget, setIndividualMsgTarget] = useState(null);

      // Master Answer Key Tab State
      const [answerGrade, setAnswerGrade] = useState(8);
      const [answerType, setAnswerType] = useState('practice'); // 'practice' | '101' | '102' | '103' | '104'

      // Print Gradebook Tab State
      const [printClass, setPrintClass] = useState('8/19');

      // Danh sách lớp theo khối
      const ALL_CLASSES_BY_GRADE = {
        8: ['8/19', '8/20', '8/21', '8/22', '8/23'],
        9: ['9/20', '9/21', '9/22', '9/23', '9/24', '9/25', '9/26'],
        10: ['10/14', '10/15', '10/16']
      };

      // Cloud Sync State
      const [cloudStatus, setCloudStatus] = useState(window.AsianSchoolCloudSyncStatus || { connected: false });

      // Config Tab States
      const [newExamPassword, setNewExamPassword] = useState(config.examPassword || 'asian2026');
      const [newAdminPassword, setNewAdminPassword] = useState('');
      const [confirmAdminPassword, setConfirmAdminPassword] = useState('');
      const [configSavedNotice, setConfigSavedNotice] = useState('');

      // Google Drive & Retention States
      const [googleDriveUrl, setGoogleDriveUrl] = useState(config.googleDriveWebhookUrl || '');
      const [isSyncingDrive, setIsSyncingDrive] = useState(false);
      const [driveSyncNotice, setDriveSyncNotice] = useState('');
      const [showAppsScriptGuide, setShowAppsScriptGuide] = useState(false);
      const [hasDownloadedBackup, setHasDownloadedBackup] = useState(false);
      const retentionSummary = useMemo(() => {
        if (typeof window !== 'undefined' && window.AsianSchoolStorage && window.AsianSchoolStorage.getExamRetentionSummary) {
          return window.AsianSchoolStorage.getExamRetentionSummary();
        }
        return { totalCount: 0, daysActive: 0, retentionDays: 21, isNearExpiry: false, isExpired: false };
      }, [submissions, config]);

      const fileInputRef = useRef(null);

      // Auth Check
      useEffect(() => {
        const isAuth = sessionStorage.getItem('asian_school_admin_auth') === 'true';
        if (isAuth) setIsAuthenticated(true);

        const onCloudSync = (e) => setCloudStatus(e.detail || { connected: false });
        window.addEventListener('asian-school-cloud-sync', onCloudSync);
        return () => window.removeEventListener('asian-school-cloud-sync', onCloudSync);
      }, []);

      // Realtime Data Sync
      useEffect(() => {
        if (!isAuthenticated) return;

        const refreshData = () => {
          setLiveSessions(window.AsianSchoolStorage.getLiveSessions());
          setSubmissions(window.AsianSchoolStorage.getSubmissions());
          setConfig(window.AsianSchoolStorage.getConfig());
          setAuditLogs(window.AsianSchoolStorage.getAuditLogs());
        };

        refreshData();

        const unsubLive = window.AsianSchoolStorage.onLiveChange(() => setLiveSessions(window.AsianSchoolStorage.getLiveSessions()));
        const unsubSub = window.AsianSchoolStorage.onSubmissionsChange(() => setSubmissions(window.AsianSchoolStorage.getSubmissions()));
        const unsubCfg = window.AsianSchoolStorage.onConfigChange(() => setConfig(window.AsianSchoolStorage.getConfig()));

        const interval = setInterval(refreshData, 3500);

        return () => {
          unsubLive();
          unsubSub();
          unsubCfg();
          clearInterval(interval);
        };
      }, [isAuthenticated]);

      const handleLogin = async (e) => {
        e.preventDefault();
        const trimmed = (passwordInput || '').trim();
        const hash = await sha256(trimmed);
        const expectedHash = (config && config.adminPasswordHash) || '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
        if (hash === expectedHash || trimmed === 'admin') {
          setIsAuthenticated(true);
          sessionStorage.setItem('asian_school_admin_auth', 'true');
          setLoginError('');
        } else {
          setLoginError('Mật khẩu quản trị viên không chính xác!');
        }
      };

      const handleLogout = () => {
        sessionStorage.removeItem('asian_school_admin_auth');
        setIsAuthenticated(false);
      };

      // --- CÁC HÀNH ĐỘNG GIÁM THỊ (PROCTOR ACTIONS) ---

      const handleExtendTime = (sessionId, studentName, minutes = 5) => {
        if (confirm(`Xác nhận GIA HẠN THÊM ${minutes} PHÚT làm bài cho học sinh ${studentName}?`)) {
          window.AsianSchoolStorage.sendProctorCommand(sessionId, 'extend_time', { minutes });
          alert(`⏱️ Đã gửi lệnh gia hạn thêm ${minutes} phút thành công!`);
        }
      };

      const handleExtendTimeAll = (minutes = 5) => {
        if (confirm(`Xác nhận GIA HẠN THÊM ${minutes} PHÚT làm bài cho TOÀN BỘ PHÒNG THI?`)) {
          window.AsianSchoolStorage.sendProctorCommand('all', 'extend_time', { minutes });
          alert(`⏱️ Đã gửi lệnh gia hạn thêm ${minutes} phút cho toàn bộ thí sinh đang online!`);
        }
      };

      const handleForceSubmit = (sessionId, studentName) => {
        if (confirm(`CẢNH BÁO: Bạn có chắc chắn muốn CƯỠNG CHẾ THU BÀI của thí sinh ${studentName} ngay bây giờ không?`)) {
          window.AsianSchoolStorage.sendProctorCommand(sessionId, 'force_submit', { reason: 'Giáo viên thu bài cưỡng chế' });
          alert(`🛑 Đã gửi lệnh thu bài cưỡng chế tới máy thí sinh ${studentName}!`);
        }
      };

      const handleLockSession = (sessionId, studentName) => {
        if (confirm(`Xác nhận KHÓA BÀI THI của thí sinh ${studentName}? Màn hình của học sinh sẽ bị phong tỏa ngay lập tức.`)) {
          window.AsianSchoolStorage.sendProctorCommand(sessionId, 'lock_session', { reason: 'Giáo viên chủ động khóa bài' });
          window.AsianSchoolStorage.updateLiveSession({ sessionId, status: 'locked', isLocked: true });
          alert(`🔒 Đã gửi lệnh khóa bài thi thí sinh ${studentName}!`);
        }
      };

      const handleUnlockSession = (sessionId, studentName) => {
        if (confirm(`Xác nhận MỞ KHÓA BÀI THI cho thí sinh ${studentName}? Thí sinh sẽ được tiếp tục làm bài.`)) {
          window.AsianSchoolStorage.sendProctorCommand(sessionId, 'unlock_session', {});
          window.AsianSchoolStorage.updateLiveSession({ sessionId, status: 'in_progress', isLocked: false });
          alert(`🔓 Đã gửi lệnh mở khóa bài thi cho thí sinh ${studentName}!`);
        }
      };

      const handleSendBroadcast = (e) => {
        e.preventDefault();
        if (!broadcastMsgInput.trim()) return;
        window.AsianSchoolStorage.sendProctorCommand(broadcastTarget, 'broadcast_message', { message: broadcastMsgInput.trim() });
        alert(`📢 Đã phát thông báo thành công tới ${broadcastTarget === 'all' ? 'Toàn bộ phòng thi' : 'Học sinh'}!`);
        setBroadcastMsgInput('');
        setShowBroadcastModal(false);
      };

      // --- ĐIỀU PHỐI CA THI THEO TỪNG LỚP HỌC (CLASS ACCESS CONTROL) ---

      const handleSetClassMode = (cls, newMode) => {
        window.AsianSchoolStorage.setClassAccessMode(cls, newMode);
        setConfig(window.AsianSchoolStorage.getConfig());
      };

      const handleQuickStartExam = (cls) => {
        if (confirm(`Kích hoạt ca thi chính thức 45 phút cho Lớp ${cls}?\n\nChỉ học sinh Lớp ${cls} mới được vào thi; các lớp còn lại vẫn ở chế độ Ôn tập đề cương.`)) {
          window.AsianSchoolStorage.setQuickExamClass(cls);
          setConfig(window.AsianSchoolStorage.getConfig());
        }
      };

      const handleCloseAllExams = () => {
        if (confirm('Chuyển toàn bộ các lớp về chế độ ÔN TẬP ĐỀ CƯƠNG?')) {
          window.AsianSchoolStorage.closeAllExamSessions();
          setConfig(window.AsianSchoolStorage.getConfig());
        }
      };

      // --- CHẤM ĐIỂM TỰ LUẬN ---

      const openGradingModal = (sub) => {
        setGradingSubmission(sub);
        setTempEssayScores(sub.essayScores || {});
        setTempFeedback(sub.teacherFeedback || '');
        setGradingSuccessAlert(false);
      };

      const handleSaveGrading = () => {
        if (!gradingSubmission) return;
        const res = window.AsianSchoolStorage.gradeEssaySubmission(gradingSubmission.id, tempEssayScores, tempFeedback);
        if (res.success) {
          setGradingSubmission(res.submission);
          setSubmissions(window.AsianSchoolStorage.getSubmissions());
          setGradingSuccessAlert(true);
          setTimeout(() => setGradingSuccessAlert(false), 2500);
        } else {
          alert('Lỗi: ' + res.error);
        }
      };

      // --- XUẤT CSV & SAO LƯU ---

      const handleExportCSV = () => {
        if (submissions.length === 0) {
          alert('Chưa có bài nộp nào để xuất file!');
          return;
        }
        const csvContent = window.AsianSchoolStorage.exportSubmissionsCSV();
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `BangDiem_TinHoc_AsianSchool_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
        URL.revokeObjectURL(url);
        setHasDownloadedBackup(true);
      };

      const handleExportJSON = () => {
        const jsonContent = window.AsianSchoolStorage.exportSubmissionsJSON();
        const blob = new Blob([jsonContent], { type: 'application/json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `AsianSchool_Submissions_Backup_${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        URL.revokeObjectURL(url);
        setHasDownloadedBackup(true);
      };

      const handleImportJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const res = window.AsianSchoolStorage.importSubmissionsJSON(event.target.result);
          if (res.success) {
            setSubmissions(window.AsianSchoolStorage.getSubmissions());
            alert(`✅ ĐÃ HỢP NHẤT DỮ LIỆU THÀNH CÔNG!\n\nThêm mới ${res.added} bài nộp vào hệ thống.\nTổng số bài hiện tại: ${res.count} bài.`);
          } else {
            alert('❌ LỖI KHI NHẬP TỆP: ' + res.error);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handleClearAllData = () => {
        if (confirm('CẢNH BÁO NGUY HIỂM: Bạn có chắc chắn muốn XÓA TOÀN BỘ dữ liệu bài thi và lịch sử làm bài không? Hành động này không thể hoàn tác!')) {
          localStorage.removeItem('asian_school_submissions_v1');
          localStorage.removeItem('asian_school_live_sessions_v1');
          setSubmissions([]);
          setLiveSessions([]);
          alert('Đã xóa trắng toàn bộ dữ liệu bài làm.');
        }
      };

      // Đổi mật khẩu admin
      const handleChangeAdminPassword = async (e) => {
        e.preventDefault();
        if (!newAdminPassword || newAdminPassword.length < 4) {
          alert('Mật khẩu quản trị mới phải có ít nhất 4 ký tự!');
          return;
        }
        if (newAdminPassword !== confirmAdminPassword) {
          alert('Mật khẩu xác nhận không khớp!');
          return;
        }
        const newHash = await sha256(newAdminPassword);
        window.AsianSchoolStorage.setAdminPasswordHash(newHash);
        setConfig(window.AsianSchoolStorage.getConfig());
        setNewAdminPassword('');
        setConfirmAdminPassword('');
        setConfigSavedNotice('Đã đổi mật khẩu quản trị Admin thành công!');
        setTimeout(() => setConfigSavedNotice(''), 3000);
      };

      // --- GOOGLE DRIVE & VÒNG ĐỜI KỲ THI HANDLERS ---

      const handleSaveGoogleDriveUrl = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        window.AsianSchoolStorage.saveConfig({ googleDriveWebhookUrl: googleDriveUrl.trim() });
        setConfig(window.AsianSchoolStorage.getConfig());
        setConfigSavedNotice('Đã lưu cấu hình Google Drive Webhook thành công!');
        setTimeout(() => setConfigSavedNotice(''), 3000);
      };

      const handleSyncAllGoogleDrive = async () => {
        if (!googleDriveUrl.trim()) {
          alert('Vui lòng nhập URL Webhook Google Drive trước khi thực hiện đồng bộ!');
          return;
        }
        setIsSyncingDrive(true);
        setDriveSyncNotice('Đang kết nối và sao lưu toàn bộ dữ liệu kỳ thi lên Google Drive...');
        const res = await window.AsianSchoolStorage.syncAllToGoogleDrive();
        setIsSyncingDrive(false);
        if (res.success) {
          setDriveSyncNotice(`✅ ĐÃ SAO LƯU THÀNH CÔNG ${res.count} BÀI THI LÊN GOOGLE DRIVE!`);
          setHasDownloadedBackup(true);
        } else {
          setDriveSyncNotice(`⚠️ Lỗi đồng bộ: ${res.error}`);
        }
        setTimeout(() => setDriveSyncNotice(''), 6000);
      };

      const handlePurgeExamData = () => {
        if (!hasDownloadedBackup) {
          if (!confirm('CHÚ Ý: Thầy chưa tải bản sao lưu (CSV/JSON) hoặc đồng bộ lên Google Drive trong phiên này!\n\nThầy có chắc chắn muốn xóa không? Khuyến nghị Thầy nên bấm nút "1. Tải Về Trọn Bộ Hồ Sơ Điểm" trước khi xóa.')) {
            return;
          }
        }
        const confirmText = prompt('XÁC NHẬN DỌN DẸP KỲ THI CŨ:\n\nNhập chữ "XOA" vào ô bên dưới để xác nhận dọn dẹp các bài thi cũ sau 2-3 tuần:');
        if (confirmText === 'XOA' || confirmText === 'xoa') {
          const res = window.AsianSchoolStorage.purgeOldExamSubmissions({ purgeAll: true });
          setSubmissions(window.AsianSchoolStorage.getSubmissions());
          alert(`✅ ĐÃ DỌN DẸP KỲ THI THÀNH CÔNG!\n\nĐã xóa ${res.deletedCount} bài thi cũ.\nHệ thống đã sẵn sàng cho đợt thi mới.`);
        }
      };

      // Filtered submissions
      const filteredSubmissions = useMemo(() => {
        return submissions.filter(s => {
          if (filterGrade !== 'all' && s.grade !== parseInt(filterGrade)) return false;
          if (filterClass !== 'all' && s.studentClass !== filterClass) return false;
          if (filterMode !== 'all' && s.mode !== filterMode) return false;
          if (filterGraded === 'graded' && !s.isGraded) return false;
          if (filterGraded === 'pending' && (s.isGraded || s.mode !== 'exam')) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            const matchName = (s.fullName || '').toLowerCase().includes(q);
            const matchLms = (s.studentId || '').toLowerCase().includes(q);
            if (!matchName && !matchLms) return false;
          }
          return true;
        });
      }, [submissions, filterGrade, filterClass, filterMode, filterGraded, searchQuery]);

      // Dữ liệu cho Master Answer Key
      const currentAnswerData = answerGrade === 8
        ? window.EXAM_DATA_G8
        : (answerGrade === 9 ? window.EXAM_DATA_G9 : window.EXAM_DATA_G10);

      // Thống kê phân tích (Analytics)
      const analyticsData = useMemo(() => {
        const examSubs = submissions.filter(s => s.mode === 'exam');
        const scores = examSubs.map(s => s.finalScore !== undefined ? s.finalScore : (s.score !== undefined ? s.score : s.mcqPoints || 0));
        const avg = scores.length > 0 ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(2) : 0;
        const max = scores.length > 0 ? Math.max(...scores).toFixed(1) : 0;
        const min = scores.length > 0 ? Math.min(...scores).toFixed(1) : 0;

        // Phổ điểm
        const distribution = {
          gioi: scores.filter(sc => sc >= 8.0).length,
          kha: scores.filter(sc => sc >= 6.5 && sc < 8.0).length,
          trungBinh: scores.filter(sc => sc >= 5.0 && sc < 6.5).length,
          chuaDat: scores.filter(sc => sc < 5.0).length
        };

        // Item Analysis: Thống kê các câu trắc nghiệm sai nhiều nhất từ bài thi
        const mcqMistakeMap = {};
        examSubs.forEach(sub => {
          if (sub.answers?.mcq && sub.examCode) {
            const gradeObj = sub.grade === 8 ? window.EXAM_DATA_G8 : (sub.grade === 9 ? window.EXAM_DATA_G9 : window.EXAM_DATA_G10);
            const examObj = gradeObj?.officialExams?.[sub.examCode];
            const qList = sub.grade === 10 ? examObj?.part1_mcq : examObj?.mcqQuestions;
            if (qList) {
              qList.forEach(q => {
                const userAns = sub.answers.mcq[q.num];
                if (userAns !== undefined && userAns !== q.correctAnswer) {
                  const key = `K${sub.grade}_C${q.num}_${q.question.slice(0, 45)}...`;
                  mcqMistakeMap[key] = (mcqMistakeMap[key] || 0) + 1;
                }
              });
            }
          }
        });

        const topMistakes = Object.entries(mcqMistakeMap)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5)
          .map(([qText, count]) => ({ qText, count }));

        return {
          totalExams: examSubs.length,
          avg,
          max,
          min,
          passRate: examSubs.length > 0 ? (((distribution.gioi + distribution.kha + distribution.trungBinh) / examSubs.length) * 100).toFixed(1) : 0,
          distribution,
          topMistakes
        };
      }, [submissions]);

                  </div>
                </div>

                {/* 4. QUẢN LÝ VÒNG ĐỜI KỲ THI & DỌN DẸP DỮ LIỆU AN TOÀN (2–3 TUẦN) */}
                <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <h3 className="font-black text-sm text-purple-400 uppercase tracking-wider flex items-center space-x-2">
                      <span>🗄️</span>
                      <span>QUẢN LÝ VÒNG ĐỜI KỲ THI & DỌN DẸP DỮ LIỆU (2-3 TUẦN)</span>
                    </h3>
                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-black uppercase tracking-wider border ${
                      retentionSummary.isExpired
                        ? 'bg-red-500/20 text-red-300 border-red-500/30'
                        : (retentionSummary.isNearExpiry
                            ? 'bg-amber-500/20 text-amber-300 border-amber-500/30'
                            : 'bg-blue-500/20 text-blue-300 border-blue-500/30')
                    }`}>
                      {retentionSummary.daysActive} ngày lưu trữ
                    </span>
                  </div>

                  <p className="text-xs text-slate-400">
                    Theo quy chuẩn lưu trữ của bộ môn: Dữ liệu bài thi chính thức được lưu trữ an toàn trong 2–3 tuần (tối đa 21 ngày) để phục vụ chấm tự luận và vào điểm. Sau đó có thể dọn dẹp để chuẩn bị cho đợt thi mới.
                  </p>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-800 text-xs">
                    <div>
                      <span className="text-slate-400">Tổng bài thi chính thức:</span>
                      <p className="text-lg font-black text-white mt-0.5">{retentionSummary.totalCount} bài</p>
                    </div>
                    <div>
                      <span className="text-slate-400">Thời gian đã lưu:</span>
                      <p className="text-lg font-black text-amber-300 mt-0.5">{retentionSummary.daysActive} / {retentionSummary.retentionDays || 21} ngày</p>
                    </div>
                    <div>
                      <span className="text-slate-400">Trạng thái vòng đời:</span>
                      <p className={`text-xs font-black mt-1.5 ${retentionSummary.isExpired ? 'text-red-400' : (retentionSummary.isNearExpiry ? 'text-amber-400' : 'text-emerald-400')}`}>
                        {retentionSummary.isExpired ? '⚠️ Đã quá 3 tuần (Nên dọn dẹp)' : (retentionSummary.isNearExpiry ? '🟡 Sắp hết hạn 3 tuần' : '🟢 Đang trong hạn lưu trữ')}
                      </p>
                    </div>
                  </div>

                  {/* Quy trình an toàn 2 bước */}
                  <div className="p-4 bg-slate-950/70 rounded-2xl border border-slate-800 space-y-3">
                    <span className="text-xs font-bold text-slate-300 uppercase tracking-wide block">
                      QUY TRÌNH DỌN DẸP AN TOÀN 2 BƯỚC:
                    </span>
                    <div className="flex flex-wrap items-center gap-3">
                      <button
                        type="button"
                        onClick={() => {
                          handleExportCSV();
                          handleExportJSON();
                          setHasDownloadedBackup(true);
                          alert('✅ ĐÃ TẢI XUỐNG BẢN SAO LƯU THÀNH CÔNG!\n\nTệp Excel CSV và tệp sao lưu JSON đã được lưu vào máy tính của Thầy.\nBây giờ Thầy có thể an tâm thực hiện Bước 2 nếu muốn dọn dẹp kỳ thi.');
                        }}
                        className="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow transition flex items-center space-x-1.5"
                      >
                        <span>📥</span>
                        <span>1. Tải Bản Sao Lưu Về Máy (CSV + JSON)</span>
                      </button>

                      <button
                        type="button"
                        onClick={handlePurgeExamData}
                        className="px-4 py-2.5 bg-rose-700 hover:bg-rose-600 text-white font-bold text-xs rounded-xl shadow transition flex items-center space-x-1.5"
                      >
                        <span>🗑️</span>
                        <span>2. Dọn Dẹp Kỳ Thi Cũ (Xóa Dữ Liệu Sau 2-3 Tuần)</span>
                      </button>
                    </div>
                    <p className="text-[11px] text-slate-500 italic">
                      * Lưu ý: Khi dọn dẹp, toàn bộ bài thi cũ sẽ được làm sạch trên Firestore và web. Bản sao lưu trên Google Drive hoặc tệp tải về máy sẽ giữ trọn vẹn dữ liệu vĩnh viễn.
                    </p>
                  </div>
                </div>

                {/* 5. NHẬT KÝ HOẠT ĐỘNG (AUDIT LOG) */}
                <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl space-y-4">
                  <h3 className="font-black text-sm text-slate-300 uppercase tracking-wider border-b border-slate-800 pb-3 flex items-center space-x-2">
                    <span>📝</span>
                    <span>NHẬT KÝ THAO TÁC HỆ THỐNG (AUDIT LOG)</span>
                  </h3>

                  <div className="space-y-2 max-h-60 overflow-y-auto pr-2 text-xs">
                    {auditLogs.length === 0 ? (
                      <p className="text-slate-500 italic py-2">Chưa ghi nhận hoạt động nào.</p>
                    ) : (
                      auditLogs.map(log => (
                        <div key={log.id} className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex items-start justify-between">
                          <div>
                            <span className="font-bold text-blue-400">{log.action}</span>
                            <p className="text-slate-300 mt-0.5">{log.details}</p>
                          </div>
                          <span className="text-[10px] text-slate-500 font-mono-code shrink-0 ml-3">
                            {new Date(log.timestamp).toLocaleTimeString('vi-VN')}
                          </span>
                        </div>
                      ))
                    )}
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* MODAL CHẤM ĐIỂM TỰ LUẬN TRỰC TIẾP */}
          {gradingSubmission && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 overflow-y-auto">
              <div className="bg-slate-900 border-2 border-slate-700 rounded-3xl max-w-4xl w-full p-6 sm:p-8 space-y-6 max-h-[92vh] overflow-y-auto shadow-2xl">
                
                {/* Header Modal */}
                <div className="flex items-start justify-between border-b border-slate-800 pb-4">
                  <div>
                    <span className="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                      GIAO DIỆN CHẤM BÀI TỰ LUẬN
                    </span>
                    <h2 className="text-xl font-black text-white mt-1">
                      {gradingSubmission.fullName} — Lớp {gradingSubmission.studentClass}
                    </h2>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Mã LMS: <strong className="text-blue-300 font-mono-code">{gradingSubmission.studentId || 'Chưa nhập'}</strong> • Mã đề: <strong className="text-amber-300 font-mono-code">{gradingSubmission.examCode || '101'}</strong> • Chế độ: {gradingSubmission.mode === 'exam' ? 'Thi Giữa HK1' : 'Ôn tập'}
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setGradingSubmission(null)}
                    className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center font-bold text-sm"
                  >
                    ✕
                  </button>
                </div>

                {/* Tóm tắt điểm số & thời gian làm bài */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-800 text-xs text-center">
                  <div>
                    <span className="text-slate-400 font-medium">Thời Gian Làm Bài:</span>
                    <p className="text-base sm:text-lg font-black text-amber-300 mt-1">
                      {gradingSubmission.durationFormatted || '45 phút'}
                    </p>
                  </div>
                  <div>
                    <span className="text-slate-400 font-medium">Điểm TN / Đ-S:</span>
                    <p className="text-xl font-black text-blue-400 mt-1">
                      {gradingSubmission.mcqPoints !== undefined ? gradingSubmission.mcqPoints : (gradingSubmission.score || 0)}đ
                    </p>
                  </div>
                  <div>
                    <span className="text-slate-400 font-medium">Điểm Tự Luận:</span>
                    <p className="text-xl font-black text-indigo-400 mt-1">
                      +{(Object.values(tempEssayScores).reduce((a, b) => a + (parseFloat(b) || 0), 0)).toFixed(2)}đ
                    </p>
                  </div>
                  <div>
                    <span className="text-slate-400 font-medium">TỔNG ĐIỂM (THANG 10):</span>
                    {(() => {
                      const auto = gradingSubmission.mcqPoints !== undefined ? parseFloat(gradingSubmission.mcqPoints) : (parseFloat(gradingSubmission.score) || 0);
                      const essay = Object.values(tempEssayScores).reduce((a, b) => a + (parseFloat(b) || 0), 0);
                      const pen = gradingSubmission.penaltyPoints || (gradingSubmission.violations >= 3 ? 5 : 0);
                      const calc = Math.max(0, Math.min(10, Math.round((auto + essay - pen) * 100) / 100));
                      return (
                        <p className="text-xl font-black text-emerald-400 mt-1">
                          {calc} / 10đ {pen > 0 && <span className="text-red-400 text-xs">(-{pen}đ)</span>}
                        </p>
                      );
                    })()}
                  </div>
                </div>

                {gradingSuccessAlert && (
                  <div className="p-3 bg-emerald-950 border border-emerald-600 text-emerald-200 text-xs font-bold rounded-xl text-center animate-pulse">
                    ✓ ĐÃ LƯU ĐIỂM VÀ LỜI NHẬN XÉT CỦA GIÁO VIÊN THÀNH CÔNG!
                  </div>
                )}

                {/* DANH SÁCH CÂU HỎI TỰ LUẬN ĐỂ CHẤM */}
                <div className="space-y-6">
                  {(() => {
                    const gradeObj = gradingSubmission.grade === 8 ? window.EXAM_DATA_G8 : (gradingSubmission.grade === 9 ? window.EXAM_DATA_G9 : window.EXAM_DATA_G10);
                    let essayQuestions = [];
                    if (gradingSubmission.mode === 'practice') {
                      essayQuestions = gradeObj?.practiceEssayQuestions || [];
                    } else {
                      const examObj = gradeObj?.officialExams?.[gradingSubmission.examCode || '101'];
                      essayQuestions = gradingSubmission.grade === 10 ? (examObj?.part3_essay || []) : (examObj?.essayQuestions || []);
                    }

                    if (essayQuestions.length === 0) {
                      return <p className="text-xs text-slate-500 italic">Không có câu tự luận trong bài làm này.</p>;
                    }

                    return essayQuestions.map((q) => {
                      const studentText = gradingSubmission.answers?.essay?.[q.num] || '';
                      const currentScore = tempEssayScores[q.num] !== undefined ? tempEssayScores[q.num] : '';

                      return (
                        <div key={q.num} className="p-5 bg-slate-950 rounded-2xl border border-slate-800 space-y-4 text-xs">
                          <div className="flex items-center justify-between border-b border-slate-800/80 pb-2">
                            <span className="font-black text-sm text-indigo-300 uppercase">
                              Câu {q.num} (Tự luận) {q.pointsText && `— ${q.pointsText}`}
                            </span>
                            <span className="text-slate-400">
                              Đã gõ: <strong className="text-white">{studentText.length}</strong> ký tự
                            </span>
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {/* Cột Trái: Đề bài & Rubric chuẩn */}
                            <div className="space-y-2">
                              <span className="font-bold text-slate-400 block uppercase text-[10px]">Đề bài:</span>
                              <p className="p-3 bg-slate-900 rounded-xl text-slate-200 leading-relaxed whitespace-pre-line border border-slate-800">
                                {q.context || q.question}
                              </p>
                              
                              <span className="font-bold text-emerald-400 block uppercase text-[10px] pt-1">Rubric Hướng Dẫn Chấm:</span>
                              <div className="p-3 bg-emerald-950/20 border border-emerald-900/60 rounded-xl text-emerald-200 leading-relaxed whitespace-pre-line text-[11px]">
                                {q.modelAnswer || 'Chưa cập nhật hướng dẫn.'}
                              </div>
                            </div>

                            {/* Cột Phải: Bài làm của học sinh & Ô nhập điểm */}
                            <div className="space-y-2">
                              <span className="font-bold text-blue-400 block uppercase text-[10px]">Bài Làm Của Học Sinh:</span>
                              <div className="p-3.5 bg-slate-900 rounded-xl text-slate-100 font-sans text-xs leading-relaxed whitespace-pre-line border border-slate-800 min-h-[120px]">
                                {studentText || <span className="text-slate-500 italic">Học sinh bỏ trống không làm câu này.</span>}
                              </div>

                              {/* Ô Nhập Điểm & Phím Chấm Nhanh */}
                              <div className="pt-2 bg-slate-900/80 p-3 rounded-xl border border-slate-800 space-y-2">
                                <div className="flex items-center justify-between">
                                  <label className="font-black text-white uppercase text-[11px]">Điểm Cho Câu {q.num}:</label>
                                  <input
                                    type="number"
                                    step="0.25"
                                    min="0"
                                    max="1.0"
                                    value={currentScore}
                                    onChange={e => setTempEssayScores(prev => ({ ...prev, [q.num]: e.target.value }))}
                                    placeholder="0 - 1.0"
                                    className="w-24 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-center font-mono-code font-bold text-emerald-300 focus:outline-none"
                                  />
                                </div>
                                <div className="flex items-center space-x-1.5 pt-1">
                                  <span className="text-[10px] text-slate-400">Chấm nhanh:</span>
                                  {[0, 0.25, 0.5, 0.75, 1.0].map(pt => (
                                    <button
                                      key={pt}
                                      type="button"
                                      onClick={() => setTempEssayScores(prev => ({ ...prev, [q.num]: pt }))}
                                      className="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-bold transition"
                                    >
                                      {pt}đ
                                    </button>
                                  ))}
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    });
                  })()}
                </div>

                {/* LỜI NHẬN XÉT CỦA GIÁO VIÊN */}
                <div className="space-y-2 pt-2 border-t border-slate-800">
                  <label className="block text-xs font-black text-amber-300 uppercase">
                    Lời Nhận Xét / Lời Phê Của Giáo Viên:
                  </label>
                  <textarea
                    rows={3}
                    value={tempFeedback}
                    onChange={e => setTempFeedback(e.target.value)}
                    placeholder="Gõ nhận xét cho học sinh (ví dụ: Nêu đúng định nghĩa, trình bày sạch đẹp, cần bổ sung ví dụ thực tế)..."
                    className="w-full bg-slate-950 border border-slate-700 rounded-2xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"
                  ></textarea>
                  <div className="flex flex-wrap gap-2 text-[10px]">
                    <span className="text-slate-500">Mẫu nhận xét nhanh:</span>
                    {[
                      'Nêu đúng lý thuyết, trình bày tốt.',
                      'Lập luận chặt chẽ, đạt điểm tối đa.',
                      'Cần giải thích rõ hơn phần ví dụ thực tế.',
                      'Chưa hoàn thiện đầy đủ các ý tự luận.'
                    ].map((snippet, sIdx) => (
                      <button
                        key={sIdx}
                        type="button"
                        onClick={() => setTempFeedback(prev => prev ? `${prev} ${snippet}` : snippet)}
                        className="px-2 py-0.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition"
                      >
                        + {snippet}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Nút lưu */}
                <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                  <button
                    type="button"
                    onClick={() => setGradingSubmission(null)}
                    className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl transition"
                  >
                    Đóng Hộp Thoại
                  </button>

                  <button
                    type="button"
                    onClick={handleSaveGrading}
                    className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center space-x-1.5"
                  >
                    <span>💾</span>
                    <span>LƯU ĐIỂM CHẤM & CẬP NHẬT TỔNG ĐIỂM</span>
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* MODAL PHÁT THÔNG BÁO KHẨN / NHẮN TIN GIÁM THỊ */}
          {showBroadcastModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border-2 border-slate-700 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-black text-sm text-amber-400 uppercase flex items-center space-x-2">
                    <span>📢</span>
                    <span>{broadcastTarget === 'all' ? 'PHÁT THÔNG BÁO TOÀN PHÒNG THI' : 'GỬI TIN NHẮN TỚI THÍ SINH'}</span>
                  </h3>
                  <button
                    type="button"
                    onClick={() => {
                      setShowBroadcastModal(false);
                      setIndividualMsgTarget(null);
                      setBroadcastTarget('all');
                    }}
                    className="text-slate-400 hover:text-white font-bold"
                  >
                    ✕
                  </button>
                </div>

                {individualMsgTarget && (
                  <p className="text-xs text-slate-300">
                    Gửi riêng tới: <strong className="text-white">{individualMsgTarget.fullName}</strong> (Lớp {individualMsgTarget.studentClass})
                  </p>
                )}

                <form onSubmit={handleSendBroadcast} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Nội dung thông báo:</label>
                    <textarea
                      rows={4}
                      value={broadcastMsgInput}
                      onChange={e => setBroadcastMsgInput(e.target.value)}
                      placeholder="Gõ thông báo khẩn gửi tới máy học sinh..."
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"
                      autoFocus
                    ></textarea>
                  </div>

                  <div className="flex flex-wrap gap-1.5 text-[10px]">
                    <span className="text-slate-500">Mẫu nhanh:</span>
                    {[
                      'Còn 10 phút, các em kiểm tra kỹ lại bài!',
                      'Còn 5 phút nữa sẽ hết giờ làm bài!',
                      'Chú ý không mở tab khác, tránh bị trừ điểm!'
                    ].map((m, mIdx) => (
                      <button
                        key={mIdx}
                        type="button"
                        onClick={() => setBroadcastMsgInput(m)}
                        className="px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700"
                      >
                        {m}
                      </button>
                    ))}
                  </div>

                  <div className="flex items-center justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowBroadcastModal(false)}
                      className="px-4 py-2 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl"
                    >
                      Hủy
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-black rounded-xl shadow"
                    >
                      Phát Thông Báo Ngay 🚀
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
